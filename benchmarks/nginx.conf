worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log 	  off;
    error_log     /dev/null;
    etag          off;

    sendfile        on;
    tcp_nopush     on;

    server {
        listen       3456;
        server_name  _;

        location / {
            root   /var/www/files;
        }
    }
}
